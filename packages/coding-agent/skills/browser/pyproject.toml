[project]
name = "prime-agent-skill-browser"
version = "0.1.0"
description = "Attach to an existing Chrome instance through loopback CDP."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "websockets>=13,<16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser"]
